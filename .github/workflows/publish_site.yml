name: Publish News Site

on:
  workflow_run:
    workflows: ["Process & Daily Digest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Cloudflare 側が停滞すると deploy が無限に待つ (2026-07-03〜09 に 45 分ハング × 6 回)。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site data
        run: python scripts/build_site_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        env:
          # Cloudflare Pages 配信時の絶対 URL とベースパス。
          # Direct Upload 構成では base=/ で良いので明示的に "/" を渡す。
          PUBLIC_SITE_URL: "https://info-collector-a5y.pages.dev"
          PUBLIC_BASE_PATH: "/"
        run: npm run build

      # site/wrangler.toml (pages_build_output_dir=./dist, D1 binding) と
      # site/functions/ (Pages Functions) を含めてデプロイするため site/ で実行する。
      # Cloudflare API は長文/多バイトの commit message を invalid UTF-8 として
      # reject することがあるため、明示的に短い ASCII (1単語) を渡す。
      # wrangler は site/package.json に exact 固定 (CLI 側の更新で挙動が変わらないように)。
      - name: Deploy to Cloudflare Pages
        working-directory: site
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployed=""
          for i in 1 2 3; do
            if npx --no-install wrangler pages deploy \
                 --project-name=info-collector \
                 --branch=main \
                 --commit-hash="${GITHUB_SHA}" \
                 --commit-message=ci; then
              deployed=1
              break
            fi
            echo "::warning::Cloudflare deploy attempt $i failed; retrying"
            sleep $((i * 30))
          done
          [ -n "$deployed" ] || { echo "::error::Cloudflare deploy failed after 3 attempts"; exit 1; }
