name: Notify Priority (S/A)
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.lock
      - name: Notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_PRIORITY: ${{ secrets.DISCORD_WEBHOOK_PRIORITY }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: python -m src.jobs.notify_priority
      - name: Commit dedup cache
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add data/cache data/logs || true
          git diff --quiet --staged || git commit -m "notify cache $(date -u +%FT%TZ)"
          # コミット後に残った未追跡の生成物は pull をブロックするので捨てる
          git ls-files --others --exclude-standard -z -- data docs site | xargs -0 -r rm -f
          pushed=""
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs && git push; then pushed=1; break; fi
            echo "::warning::push attempt $i failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          [ -n "$pushed" ] || { echo "::error::git push failed after 3 attempts"; exit 1; }
