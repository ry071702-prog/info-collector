name: Rerun Transient Failures

# GitHub 側の一時障害 (ランナー未割当など) で落ちた定期実行を1回だけ自動再実行する
# 本物のバグは再実行でも落ちて通知が来るので握り潰しにはならない

on:
  workflow_run:
    workflows:
      - Collect Realtime
      - Collect Regular (3h)
      - Collect Daily (low priority)
      - Notify Priority (S/A)
      - Process & Daily Digest
      - Publish News Site
      - Send Catchup Mail
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
