# 月次・全依存を1PRにまとめる (ノイズ最小)
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-pip:
        patterns: ["*"]
    open-pull-requests-limit: 3
    ignore:
      # google-genai が tenacity<9.2.0 を要求している (2.34.0 時点)  上げると requirements.lock が解決できない  外れたら消す
      - dependency-name: "tenacity"
        versions: [">=9.2"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
